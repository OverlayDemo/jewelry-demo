<!DOCTYPE html>
<html>
<head>
    <title>My Jewelry Store</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .item {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
        }

        img {
            max-width: 150px;
        }
    </style>
</head>
<body>

    <h1>Welcome to the Jewelry Collection</h1>
    <div id="list"></div>

    <script src="data.js"></script>

    <script>const container = document.getElementById('list');

        // Loop through the products from data.js
        if (typeof products !== 'undefined') {
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                            <h3>${p.name}</h3>
                            <img src="${p.image}" alt="${p.name}"><br>
                            <p>Price: $${p.price}</p>
                            <a href="product.html?id=${p.id}">View Details</a>
                        `;
                container.appendChild(div);
            });
        } else {
            container.innerHTML = "<p>Error: Could not load products.</p>";
        }</script>

</body>
</html>
